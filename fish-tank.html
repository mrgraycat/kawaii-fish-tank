    function drawCritters() {
      const fy = floorY();
      for (const c of critters) {
        if (opts.life) {
          c.age += 1; c.cool = Math.max(0,c.cool-1);
          if (c.age > c.life) c.dead = (c.dead||0)+1;
          if (Math.random()<0.0008) poops.push({ x:c.x, y:c.y+4, vy:0.12, life:1, r:1.6 });
          c.cool = Math.max(0, (c.cool||0)-1);
          if (c.baby) {
            c.grow = Math.min(1, (c.grow||0.4) + 0.0012);
            if (c.grow > 0.92) c.baby = false;
          }
          if (!c.baby && c.sex==="F" && c.cool===0 && liveCritters().length < opts.maxCritters) {
            for (const o of liveCritters()) {
              if (o===c || o.baby || o.kind!==c.kind || o.sex===c.sex || o.cool>0) continue;
              if (Math.hypot(o.x-c.x, o.y-c.y) < 28) {
                eggs.push({ x:c.x, y:floorY()-7, kind:c.kind, critter:true, age:0, hatch: 280+rand(0,160), momId:c.id, dadId:o.id });
                c.cool = 1000; o.cool = 1000;
                c.married = o.married = true;
                c.partner = o.id; o.partner = c.id;
                say(c,"love","🥚"); say(o,"marry","💍");
                popHearts((c.x+o.x)/2, c.y-8, 5);
                break;
              }
            }
          }
        }
        const fam = c.fam || (CRITTERS[c.kind]||{}).fam || c.kind;
        if (fam==="clam") {
          c.y = fy-8;
          c.x += Math.sin(t*0.01+c.phase)*0.02;
          c.rot = 0;
        } else if (fam==="snail") {
          if (Math.random()<0.004) c.mode = Math.random()<0.7 ? "floor" : pick(["wall","plant"]);
          c.mode = c.mode || "floor";
          const onLeft = c.x < 28, onRight = c.x > W-28;
          if (c.mode==="wall" && (onLeft || onRight || Math.abs(c.x-18)<20 || Math.abs(c.x-(W-18))<20)) {
            const left = c.x < W/2;
            c.x += ((left?20:W-20)-c.x)*0.08;
            if (!c.vy) c.vy = -0.14;
            if (Math.random()<0.01) c.vy *= -1;
            c.y += c.vy;
            if (c.y < 90 || c.y > fy-8) { c.vy *= -1; c.mode = "floor"; }
            const want = left ? -Math.PI/2 : Math.PI/2;
            c.rot += (want - c.rot)*0.1;
          } else if (c.mode==="plant" && plants.length) {
            const p = plants[Math.abs(c.id||0)%plants.length];
            c.x += (p.x - c.x)*0.05;
            if (!c.vy) c.vy = -0.12;
            c.y += c.vy;
            if (c.y < fy-p.h-6 || c.y > fy-8) { c.vy *= -1; if (c.y > fy-10) c.mode = "floor"; }
            c.rot += (0 - c.rot)*0.1;
          } else {
            c.mode = "floor";
            if (Math.random()<0.012) c.vx = rand(-0.14,0.14);
            c.x += c.vx || 0.06;
            c.y += (fy-10 - c.y)*0.12;
            c.rot += (0 - c.rot)*0.14;
          }
        } else if (fam==="crab") {
          if (Math.random()<0.008) c.mode = pick(["floor","plant"]);
          if (c.mode==="plant" && plants.length) {
            const p = plants[Math.abs((c.id||1))%plants.length];
            c.x += (p.x-c.x)*0.04;
            c.y += ((fy-Math.min(36,p.h*0.45)) - c.y)*0.04;
            c.rot += (0.4 - c.rot)*0.05;
          } else {
            if (Math.random()<0.02) c.vx = (Math.random()<0.5?-1:1)*rand(0.18,0.5);
            c.x += c.vx;
            c.y += (fy-10 - c.y)*0.12;
            c.rot += (0-c.rot)*0.14;
          }
        } else {
          if (Math.random()<0.01) c.mode = pick(["floor","plant"]);
          if (c.mode==="plant" && plants.length) {
            const p = plants[Math.abs((c.id||2))%plants.length];
            c.x += (p.x-c.x)*0.05 + Math.sin(t*0.08+c.phase)*0.2;
            c.y += ((fy-Math.min(48,p.h*0.6)) - c.y)*0.05;
            c.rot += (0 - c.rot)*0.12;
          } else {
            if (Math.random()<0.03) c.vx = rand(-0.7,0.7);
            c.x += c.vx;
            c.y += (fy-8 - c.y)*0.06 + Math.sin(t*0.08+c.phase)*0.2;
            c.rot += (0 - c.rot)*0.12;
          }
        }
        for (const o of critters) {
          if (o===c || o.dead) continue;
          const dx=c.x-o.x, dy=c.y-o.y, d2=dx*dx+dy*dy;
          if (d2<38*38 && d2>1) { const d=Math.sqrt(d2); c.x += dx/d*0.6; c.y += dy/d*0.3; }
        }
        c.x = clamp(c.x, 28, W-28);
        c.y = clamp(c.y, 90, fy-6);
        if (fam!=="clam" && (c.x<=16 || c.x>=W-16)) c.vx *= -1;

        if (t%12===0) doJob(c);
        if (weather==="current" && c.fam!=="clam") c.x += 0.12;
        if ((c.action==="hide"||c.action==="sleep") && typeof nearestHide==="function") {
          const hid = nearestHide(c);
          if (hid) { c.x += (hid.x-c.x)*0.04; c.y += (hid.y-c.y)*0.04; }
        } else if (Math.random()<0.002) c.action = pick(["wander","hide","sleep"]);
        updatePose(c, true);
        const step = Math.sin(t*0.18 + (c.phase||0));
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot||0);
        c.z = clamp((c.z||0.5)+(c.vz||0), 0.12, 1);
        if (Math.random()<0.015) c.vz = rand(-0.004,0.004);
        const gs = (c.grow||1)*(c.sizeGene||1)*depthScale(c.z);
        const tx = turnX(c.pose);
        const face = fam==="snail" ? 1 : ((c.pose||0) > 0.5 ? 1 : ((c.head||1) < 0 ? -1 : 1));
        ctx.scale(gs*face*tx, gs*(1+Math.max(0,c.pose||0)*0.08));
        drawCritterKind(c, step);
        if ((c.pose||0) < -0.5) {
          ctx.fillStyle="rgba(70,40,50,0.2)";
          ctx.beginPath(); ctx.ellipse(0,0,8,6,0,0,6.28); ctx.fill();
        }
        if (c.pattern==="spot") {
          ctx.fillStyle="rgba(90,50,70,0.28)";
          ctx.beginPath(); ctx.arc(-2,0,1.6,0,6.28); ctx.fill();
          ctx.beginPath(); ctx.arc(3,-1,1.2,0,6.28); ctx.fill();
        } else if (c.pattern==="stripe") {
          ctx.strokeStyle="rgba(90,50,70,0.3)"; ctx.lineWidth=1.3;
          ctx.beginPath(); ctx.moveTo(-4,-2); ctx.lineTo(4,2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(-3,2); ctx.lineTo(5,-1); ctx.stroke();
        }
        ctx.restore();
        drawName(c, 16);
        drawBubble(c, 16);
      }
      critters = critters.filter(c => (c.dead||0) < 50);
    }

    function drawHeart(x,y,s,color) {
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(x, y+s*0.3);
      ctx.bezierCurveTo(x-s, y-s*0.35, x-s*0.15, y-s, x, y-s*0.35);
      ctx.bezierCurveTo(x+s*0.15, y-s, x+s, y-s*0.35, x, y+s*0.3);
      ctx.fill();
    }

    function drawHearts() {
      for (const h of hearts) {
        h.y += h.vy; h.life -= 0.012;
        ctx.globalAlpha = clamp(h.life,0,1);
        drawHeart(h.x, h.y, h.s, "#ff7aa2");
      }
      ctx.globalAlpha=1;
      hearts = hearts.filter(h => h.life>0);
    }

    function drawExtras() {
      if (!opts.extras) return;
      const D = deco();
      const fy = floorY();
      const sx = D.star.x, sy = D.star.y + Math.sin(t*0.04)*1.2;
      ctx.fillStyle="#ffb4c8";
      ctx.beginPath();
      for (let i=0;i<5;i++) {
        const a=-Math.PI/2+i*1.256;
        const x=sx+Math.cos(a)*13, y=sy+Math.sin(a)*11;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        ctx.lineTo(sx+Math.cos(a+0.628)*5.5, sy+Math.sin(a+0.628)*4.5);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle="#5a3a4a";
      ctx.beginPath(); ctx.arc(sx-3,sy-1,1.7,0,6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(sx+3,sy-1,1.7,0,6.28); ctx.fill();
      ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(sx,sy+2.2,2.2,0.2,Math.PI-0.2); ctx.stroke();
      if (opts.blush) {
        ctx.fillStyle="rgba(255,120,160,0.4)";
        ctx.beginPath(); ctx.ellipse(sx-6,sy+2,2.2,1.1,0,0,6.28); ctx.fill();

    });
    window.addEventListener("deviceorientation", (e) => {
      tilt.x = (e.gamma||0)/40; tilt.y = (e.beta||0)/40;
    });
    canvas.addEventListener("pointerup", endPtr);
    canvas.addEventListener("pointercancel", endPtr);
    document.getElementById("feed").onclick = () => dropFood(rand(50,W-50), 80);
    function addCritter(kind) {
      if (critters.filter(c=>!c.dead).length >= opts.maxCritters) return false;
      spawnCritter(kind || pick(CRIT_KEYS));
      updateCount();
      return true;
    }
    document.getElementById("add").onclick = () => {
      if (fish.filter(f=>!f.dead).length >= opts.maxFish) return;
      spawnFish(pick(KEYS)); updateCount();
    };
    document.getElementById("critter").onclick = () => addCritter();
    const wrap = document.getElementById("critterBtns");
    if (wrap) {
      wrap.innerHTML = "";
      const randBtn = document.createElement("button");
      randBtn.type="button"; randBtn.textContent="Random";
      randBtn.onclick = () => addCritter();
      wrap.appendChild(randBtn);
      CRIT_KEYS.forEach(k => {
        const b = document.createElement("button");
        b.type="button"; b.textContent=k;
        b.onclick = () => addCritter(k);
        wrap.appendChild(b);
      });
    }
    document.getElementById("maxCritters").oninput = () => {
      opts.maxCritters = +document.getElementById("maxCritters").value;
      document.getElementById("maxCrittersVal").textContent = opts.maxCritters;
    };
    document.getElementById("school").onclick = () => {
      const type = pick(["neon","cardinal","rasbora","danio"]);
      const cx=rand(70,W-70), cy=rand(H*0.28,H*0.55);
      const room = opts.maxFish - fish.filter(f=>!f.dead).length;
      for (let i=0;i<Math.min(4, room);i++) spawnFish(type, cx+rand(-36,36), cy+rand(-20,20));
      updateCount();
    };
    document.getElementById("reset").onclick = starterTank;
    document.getElementById("feed").addEventListener("click", () => { beep(520,0.05,"square",0.03); buzz(); });

    loadTank();
    resize(); setupDecor();
    if (opts.theme) applyTheme(opts.theme);
    const ni = document.getElementById("nameInput");
    if (ni) ni.value = opts.name;
    if (pendingLive) restoreLiving(pendingLive);
    else starterTank();
    tell(pendingLive ? ("Welcome back to "+opts.name) : ("Welcome to "+opts.name+" · tap glass, feed, long-press to follow"), false);
    logEvent("🎀", pendingLive ? "Welcome back" : "Tank opened", opts.name);
    if (soundOn) document.getElementById("toggleMute").textContent = "🔊";
    function openTankAudio() {
      soundOn = true;
      document.getElementById("toggleMute").textContent = "🔊";
      try { startZenBed(); } catch(e){}
    }
    const shareBtn = document.getElementById("shareTank");
    if (shareBtn) shareBtn.onclick = async (e) => {
      e.stopPropagation();
      const data = { title: "Kawaii Fish Tank", text: "Peek at my tank · " + (opts.name||"kawaii tank") };
      try {
        if (navigator.share) await navigator.share(data);
        else tell("Send fish-tank.html to keep the app", false);
      } catch (err) {}
    };
    document.getElementById("enterTank").onclick = () => {
      document.getElementById("splash").classList.add("hide");
      openTankAudio();
      beep(720,0.08,"sine",0.04);
      buzz();
    };
    document.getElementById("splash").addEventListener("pointerdown", () => {
      document.getElementById("splash").classList.add("hide");
      openTankAudio();
    });
    canvas.addEventListener("pointerdown", () => {
      if (soundOn && !zenNodes) { try { startZenBed(); } catch(e){} }
    }, {passive:true});
    loop();
  </script>
</body>
</html>
