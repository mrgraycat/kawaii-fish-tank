<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f4c8d4" />
  <meta name="apple-mobile-web-app-title" content="Fish Tank" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./tank-icon.svg" />
  <title>Kawaii Fish Tank</title>
  <style>
    :root {
      --ink: #5a3a4a;
      --panel: rgba(255, 248, 242, 0.96);
      --line: #f4c8d4;
      --shadow: #e8a8b8;
      --safe-top: env(safe-area-inset-top, 12px);
      --safe-bot: env(safe-area-inset-bottom, 12px);
      --safe-left: env(safe-area-inset-left, 10px);
      --safe-right: env(safe-area-inset-right, 10px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: #f4c8d4;
      overflow: hidden;
      font-family: ui-rounded, "Trebuchet MS", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
      color: var(--ink);
      touch-action: manipulation;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
    }
    .frame {
      pointer-events: none;
      position: fixed;
      inset: 0;
      border: 10px solid #f3c2cf;
      border-radius: 36px;
      box-shadow:
        inset 0 16px 28px rgba(255,255,255,0.35),
        inset 0 -18px 28px rgba(200, 90, 130, 0.08);
    }
    .topbar {
      position: fixed;
      top: calc(var(--safe-top) + 8px);
      left: calc(var(--safe-left) + 10px);
      right: calc(var(--safe-right) + 10px);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 0 var(--shadow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title, .icon-btn, .hud button, .panel, #album, #stats, #portrait, input[type="text"] {
      color: #3a2430;
      background: #fffaf8;
    }
    .title small {
      display: block;
      font-size: 10px;
      font-weight: 700;
      opacity: 0.78;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #album {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      background: var(--panel); border-top: 2px solid var(--line);
      border-radius: 24px 24px 0 0;
      padding: 14px 16px calc(var(--safe-bot) + 16px);
      transform: translateY(110%); transition: transform 0.22s ease;
      max-height: 72dvh; overflow: auto;
    }
    #album.open { transform: translateY(0); }
    #album .entry { font-size: 12px; font-weight: 700; padding: 8px 0; border-bottom: 1px solid var(--line); }
    #album .entry small { display:block; font-size:10px; opacity:0.55; font-weight:700; margin-top:2px; }
    .icon-btn, button, select, input[type="text"] {
      appearance: none;
      border: 2px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      font-family: inherit;
      font-weight: 800;
      font-size: 14px;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      box-shadow: 0 4px 0 var(--shadow);
    }
    .hud {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: min(420px, calc(100vw - var(--safe-left) - var(--safe-right) - 20px));
      bottom: calc(var(--safe-bot) + 8px);
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
      gap: 5px;
    }
    .hud button {
      min-height: 40px;
      padding: 8px 4px;
      font-size: 13px;
      box-shadow: 0 4px 0 var(--shadow);
    }
    .hud button:active, .icon-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--shadow);
    }
    body.idle .hud, body.idle .topbar { opacity: 0.12; transition: opacity 0.6s; }
    #splash {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 30%, #ffe8f0, #f4c8d4 70%);
      color: #5a3a4a; text-align: center; padding: 24px;
    }
    #splash.hide { opacity: 0; pointer-events: none; transition: opacity 0.45s; }
    #splash h1 { font-size: 28px; margin: 0 0 8px; }
    #splash p { margin: 0 0 18px; font-weight: 700; opacity: 0.75; font-size: 14px; }
    #splash button {
      border: 2px solid #ffd0dc; background: #fffaf8; border-radius: 999px;
      padding: 12px 22px; font-weight: 800; box-shadow: 0 4px 0 #f0b3c4;
    }
    .hud, .topbar { transition: opacity 0.4s; }
    #portrait {
      position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bot) + 58px);
      z-index: 6; display: none; pointer-events: none;
      background: rgba(255,248,246,0.9); border: 2px solid var(--line);
      border-radius: 14px; padding: 8px 12px; font-size: 12px; font-weight: 800;
    }
    #portrait.on { display: block; }
    .count {
      display: none;
    }
    .panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 8;
      background: var(--panel);
      border-top: 2px solid var(--line);
      border-radius: 24px 24px 0 0;
      padding: 14px 16px calc(var(--safe-bot) + 16px);
      transform: translateY(110%);
      transition: transform 0.22s ease;
      max-height: 72dvh;
      overflow: auto;
    }
    .panel.open { transform: translateY(0); }
    .grab {
      width: 42px; height: 5px; border-radius: 99px;
      background: #f0c0cc; margin: 0 auto 10px;
    }
    .panel h3 { margin: 0 0 10px; font-size: 16px; }
    .row { margin-bottom: 12px; }
    .row label.cap {
      display: block; font-size: 11px; font-weight: 800;
      opacity: 0.8; margin-bottom: 6px; text-transform: uppercase;
      color: inherit;
    }
    input[type="text"] {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      font-size: 16px;
      box-shadow: 0 3px 0 var(--shadow);
    }
    .swatches { display: flex; gap: 10px; }
    .swatch {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #fff; box-shadow: 0 0 0 2px #f0b3c4; padding: 0;
    }
    .swatch.on { box-shadow: 0 0 0 2px #5a3a4a; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
    .checks label {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 800; min-height: 36px;
    }
    .checks input { width: 18px; height: 18px; }
    .slider-row { display:flex; align-items:center; gap:8px; }
    .slider-row input[type="range"] { flex:1; accent-color:#ff8ab0; }
    .slider-row span { min-width:28px; font-size:13px; font-weight:800; text-align:right; }
    #stats {
      position: fixed;
      left: calc(var(--safe-left) + 10px);
      right: calc(var(--safe-right) + 10px);
      top: calc(var(--safe-top) + 64px);
      z-index: 6;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 10px 44px 10px 12px;
      box-shadow: 0 6px 0 var(--shadow);
      display: none;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      pointer-events: auto;
    }
    #stats.open { display: block; }
    #stats b { font-size: 14px; }
    #stats .close-stats {
      position: absolute; top: 6px; right: 6px;
      width: 36px; height: 36px; padding: 0; box-shadow: none;
      z-index: 2; font-size: 18px; line-height: 1;
    }
    body.theme-matcha { background: #cfe6c8; color: #234028; }
    body.theme-matcha .frame { border-color: #8fbf88; }
    body.theme-matcha .title, body.theme-matcha .icon-btn, body.theme-matcha .hud button,
    body.theme-matcha .panel, body.theme-matcha #album, body.theme-matcha #stats,
    body.theme-matcha #portrait, body.theme-matcha input {
      background: #f4ffef; color: #1e3a22;
      border-color: #7aaa72; box-shadow: 0 4px 0 #6e9a68;
    }
    body.theme-night { background: #2b2450; color: #f4efff; }
    body.theme-night .frame { border-color: #6d5fb0; }
    body.theme-night .title, body.theme-night .icon-btn, body.theme-night .hud button,
    body.theme-night .panel, body.theme-night #album, body.theme-night #stats,
    body.theme-night #portrait, body.theme-night input, body.theme-night .close-stats {
      background: #2a2458; color: #f7f2ff;
      border-color: #c4b6ff; box-shadow: 0 4px 0 #4a3c86;
    }
    body.theme-festival { background: #ffd7a8; color: #4a2a10; }
    body.theme-festival .frame { border-color: #e0a05a; }
    body.theme-festival .title, body.theme-festival .icon-btn, body.theme-festival .hud button,
    body.theme-festival .panel, body.theme-festival #album, body.theme-festival #stats,
    body.theme-festival #portrait, body.theme-festival input {
      background: #fff6e8; color: #3d220c;
      border-color: #d49248; box-shadow: 0 4px 0 #c9843c;
    }
  </style>
</head>
<body class="theme-sakura">
  <div id="splash">
    <div>
      <h1>Kawaii Fish Tank</h1>
      <p>Tap to peek. Feed to spoil. Long-press to follow.</p>
      <p style="font-size:12px;opacity:.7;max-width:260px;margin:0 auto 16px">Share → Add to Home Screen to keep this tank. iPhone cannot run a live Home Screen widget of the aquarium.</p>
      <button type="button" id="enterTank">Open the glass</button>
      <button type="button" id="shareTank" style="margin-top:10px">Share tank</button>
    </div>
  </div>
  <canvas id="tank"></canvas>
  <div class="frame"></div>
  <div class="topbar">
    <div class="title" id="tankTitle">Pink Cloud Cafe<small>Sakura tank</small></div>
    <div class="icon-btn" id="count" style="width:auto;padding:0 10px;display:flex;align-items:center;justify-content:center;font-size:12px;white-space:nowrap;">0</div>
    <button class="icon-btn" id="toggleAlbum" aria-label="Album">♡</button>
    <button class="icon-btn" id="toggleMute" aria-label="Sound">🔇</button>
    <button class="icon-btn" id="togglePanel" aria-label="Customize">✦</button>
  </div>
  <div id="portrait"></div>
  <div id="stats">
    <button class="close-stats" id="closeStats" type="button" aria-label="Close">x</button>
    <div id="statsBody"></div>
  </div>
  <div class="hud">
    <button id="feed">Feed</button>
    <button id="add">Fish</button>
    <button id="critter">Critter</button>
    <button id="school">School</button>
    <button id="reset">Reset</button>
  </div>
  <aside id="album"><div class="grab"></div><h3>Scrapbook</h3><div id="albumList"></div></aside>
  <aside class="panel" id="panel">
    <div class="grab"></div>
    <h3>Customize tank</h3>
    <div class="row">
      <label class="cap">Tank name</label>
      <input id="nameInput" type="text" maxlength="22" value="Pink Cloud Cafe" />
    </div>
    <div class="row">
      <label class="cap">Theme</label>
      <div class="swatches">
        <button class="swatch on" data-theme="sakura" style="background:#f7b7c8" title="Sakura"></button>
        <button class="swatch" data-theme="matcha" style="background:#8fd3a0" title="Matcha"></button>
        <button class="swatch" data-theme="night" style="background:#6b5ea8" title="Night"></button>
        <button class="swatch" data-theme="festival" style="background:#ffb35c" title="Festival"></button>
      </div>
    </div>
    <div class="row">
      <label class="cap">Starting fish</label>
      <div class="slider-row"><input id="startFish" type="range" min="2" max="12" value="4" /><span id="startFishVal">4</span></div>
    </div>
    <div class="row">
      <label class="cap">Max fish</label>
      <div class="slider-row"><input id="maxFish" type="range" min="4" max="24" value="8" /><span id="maxFishVal">8</span></div>
    </div>
    <div class="row">
      <label class="cap">Max critters</label>
      <div class="slider-row"><input id="maxCritters" type="range" min="4" max="24" value="8" /><span id="maxCrittersVal">8</span></div>
    </div>
    <div class="row">
      <label class="cap">Add critter (30 kinds)</label>
      <div class="swatches" id="critterBtns" style="flex-wrap:wrap"></div>
    </div>
    <div class="row checks">
      <label><input type="checkbox" id="optPetals" checked /> Petals</label>
      <label><input type="checkbox" id="optLanterns" checked /> Lanterns</label>
      <label><input type="checkbox" id="optCat" checked /> Lucky cat</label>
      <label><input type="checkbox" id="optCastle" checked /> Castle</label>
      <label><input type="checkbox" id="optChest" checked /> Treasure</label>
      <label><input type="checkbox" id="optBlush" checked /> Blush</label>
      <label><input type="checkbox" id="optExtras" checked /> Decor extras</label>
      <label><input type="checkbox" id="optNames" checked /> Names</label>
      <label><input type="checkbox" id="optLife" checked /> Life cycle</label>
      <label><input type="checkbox" id="optChat" checked /> Emoji chat</label>
    </div>
  </aside>

  <script>
    const canvas = document.getElementById("tank");
    const ctx = canvas.getContext("2d");
    const countEl = document.getElementById("count");
    const titleEl = document.getElementById("tankTitle");

    let W = 0, H = 0, dpr = 1, t = 0;
    let fish = [], flakes = [], bubbles = [], plants = [], petals = [], pebbles = [], hearts = [], critters = [], poops = [], eggs = [];
    let selected = null, followCam = false, camX = 0, camY = 0, camZ = 1, focusX = 0, focusY = 0;
    let dragging = null, holdT = null, held = null, petHold = 0;
    let story = "The tank wakes up…";
    let album = [];
    let stickers = { marry:false, escape:false, fight:false };
    let extraPlants = 0, extraPearls = 0;
    let userZoom = 1, sloMo = 0, idleT = 0, scareT = 0, petStreak = 0;
    let flashlight = {on:false,x:0,y:0}, dirt = [], ripples = [];
    let thiefId = null, pearlHidden = true, lastPetDay = "";
    let pinch = null, tilt = {x:0,y:0}, lookFree = false, pan = null;
    let soundOn = false, audioCtx = null, zenNodes = null;
    const JOBS = ["gossip","cleaner","guard","chef","poet","napper"];
    const SPECIES_JOB = {
      neon:"gossip", tetra:"gossip", guppy:"party", betta:"guard", angel:"poet",
      molly:"chef", platy:"napper", sword:"guard", cory:"cleaner", otocinclus:"cleaner",
      shrimp:"cleaner", amano:"cleaner", cherry:"chef", crab:"guard", fiddler:"gossip",
      hermit:"napper", snail:"cleaner", nerite:"cleaner", clam:"poet", anemone:"guard",
      starfish:"poet", urchin:"guard", nudi:"poet", cucumber:"napper", lobster:"guard"
    };
    function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch(e){} }
    function beep(freq=880, dur=0.08, type="sine", vol=0.04) {
      if (!soundOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.value = vol; o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }
    function tell(msg, keep) {
      story = msg;
      titleEl.innerHTML = opts.name + "<small>" + story + "</small>";
      if (keep !== false) logEvent("📰", msg);
    }
    function stamp(ts) {
      const d = new Date(ts||Date.now());
      return d.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
    }
    function logEvent(icon, text, extra) {
      const last = album[0];
      if (last && last.text===text && Date.now()-last.when<2500) return;
      album.unshift({ icon: icon||"✦", text, extra: extra||"", when: Date.now() });
      album = album.slice(0, 80);
      saveTank();
    }
    function dayPhase() {
      const cyc = (t/1800) % 4;
      if (cyc < 1) return "morning";
      if (cyc < 2) return "noon";
      if (cyc < 3) return "night";
      return "festival";
    }
    let lastPhase = "morning";
    let pageantT = 0;
    let weather = "clear";
    let weatherT = 0;
    let keeperRep = 55;
    let lastFeedT = 0;
    let wanted = null;
    let dayNews = { crownFrom:null, crownTo:null, castleCrew:null, babies:0, escapes:0, weddings:0, fights:0 };
    function resetDayNews() {
      dayNews = { crownFrom:null, crownTo:null, castleCrew:null, babies:0, escapes:0, weddings:0, fights:0 };
    }
    function dailyRecap() {
      const bits = [];
      if (dayNews.crownTo && dayNews.crownFrom && dayNews.crownFrom!==dayNews.crownTo)
        bits.push(dayNews.crownTo+" dethroned "+dayNews.crownFrom);
      else if (dayNews.crownTo) bits.push(dayNews.crownTo+" still wears the crown");
      if (dayNews.castleCrew) bits.push(dayNews.castleCrew+" took the castle");
      if (dayNews.weddings) bits.push(dayNews.weddings+" wedding"+(dayNews.weddings>1?"s":""));
      if (dayNews.babies) bits.push(dayNews.babies+" bab"+(dayNews.babies===1?"y":"ies"));
      if (dayNews.escapes) bits.push(dayNews.escapes+" escape attempt"+(dayNews.escapes>1?"s":""));
      if (dayNews.fights) bits.push(dayNews.fights+" scuffle"+(dayNews.fights>1?"s":""));
      if (wanted) bits.push(wanted+" on a wanted poster");
      if (keeperRep>75) bits.push("the keeper is a celebrity");
      else if (keeperRep<35) bits.push("the keeper was a rumor");
      if (!bits.length) bits.push("quiet day. the gravel is thriving");
      const line = "Today: "+bits.join(", ");
      tell(line, false);
      logEvent("☀️", "Today in the tank", line);
      resetDayNews();
    }
    function startPageant() {
      const crown = liveFish().find(f => f.rank==="monarch") || liveFish()[0];
      if (!crown) return;
      pageantT = 420;
      crown.action = "pageant";
      tell("Festival pageant · "+crown.name+" takes a lap 👑", false);
      logEvent("🏮", "Festival", crown.name+" swam the victory lap");
      liveFish().forEach(f => { if (f!==crown) { say(f,"hype","👏"); f.mood=clamp((f.mood||70)+4,0,100); } });
      spotlight(crown, "👑", 240);
    }
    function tickCalendar() {
      const ph = dayPhase();
      if (ph !== lastPhase) {
        if (ph==="morning") dailyRecap();
        if (ph==="festival") startPageant();
        if (ph==="night") tell("Lights down · night watch out", false);
        if (ph==="morning" && Math.random()<0.35) {
          weather = "cloudy"; weatherT = 900;
          tell("Cloudy morning · nap weather", false);
        } else if (ph==="noon" && Math.random()<0.28) {
          weather = "current"; weatherT = 700;
          tell("A current rolled through", false);
        } else if (ph==="morning") weather = "clear";
        lastPhase = ph;
      }
      if (weatherT>0) { weatherT--; if (weatherT<=0) weather="clear"; }
      if (pageantT>0) {
        pageantT--;
        const crown = liveFish().find(f => f.action==="pageant") || liveFish().find(f => f.rank==="monarch");
        if (crown) {
          const ang = t*0.03;
          crown.vx += Math.cos(ang)*0.08;
          crown.vy += Math.sin(ang)*0.05;
          if (pageantT%40===0) liveFish().forEach(f => { if (f!==crown && Math.random()<0.5) say(f,"hype","👏"); });
          if (pageantT===0) crown.action="wander";
        }
      }
    }
    let pendingLive = null;
    function slimEnt(e) {
      if (!e || e.dead) return null;
      return {
        id:e.id, type:e.type, kind:e.kind, fam:e.fam, name:e.name, sex:e.sex,
        x:e.x, y:e.y, z:e.z, mood:e.mood, job:e.job, rank:e.rank,
        married:!!e.married, partner:e.partner, friendId:e.friendId,
        kids:e.kids||[], momId:e.momId, dadId:e.dadId,
        genes:e.genes, color:e.color, pattern:e.pattern, sizeGene:e.sizeGene,
        age:e.age, hungry:e.hungry, baby:!!e.baby, grow:e.grow, size:e.size,
        adult:e.adult, life:e.life, cool:e.cool, trait:e.trait, wins:e.wins
      };
    }
    function saveTank() {
      try {
        localStorage.setItem("kawaii-tank-v1", JSON.stringify({
          name: opts.name, theme: opts.theme, album, stickers, extraPlants, extraPearls, story,
          soundOn: !!soundOn,
          decoLayout,
          fish: fish.map(slimEnt).filter(Boolean).slice(0, 24),
          critters: critters.map(slimEnt).filter(Boolean).slice(0, 24)
        }));
      } catch(e) {}
    }
    function loadTank() {
      try {
        const d = JSON.parse(localStorage.getItem("kawaii-tank-v1")||"null");
        if (!d) return;
        if (d.name) opts.name = d.name;
        if (d.theme) opts.theme = d.theme;
        if (d.album) album = d.album;
        if (d.stickers) stickers = d.stickers;
        extraPlants = d.extraPlants||0;
        extraPearls = d.extraPearls||0;
        if (d.story) story = d.story;
        if (d.decoLayout) decoLayout = d.decoLayout;
        if (typeof d.soundOn === "boolean") soundOn = d.soundOn;
        if ((d.fish&&d.fish.length) || (d.critters&&d.critters.length)) pendingLive = d;
      } catch(e) {}
    }
    function addAlbum(ent, extra) {
      const who = `${ent.sex==="F"?"♀":"♂"} ${ent.name}`;
      logEvent("✝", `${who} (${ent.type||ent.kind}) ${extra||"passed on"}`, ent.job||"");
    }
    function renderAlbum() {
      const el = document.getElementById("albumList");
      const wed = album.filter(a => (a.text||"").includes("married")).length;

    function popHearts(x,y,n=5) {
      for (let i=0;i<n;i++) hearts.push({
        x:x+rand(-10,10), y:y+rand(-6,6), vy:rand(-0.7,-0.25),
        life:1, s:rand(4,7)
      });
    }
    function dropFood(x,y) {
      const fx = x??rand(40,W-40), fy = y??40;
      for (let i=0;i<9;i++) flakes.push({
        x:fx+rand(-14,14), y:fy+rand(-6,6),
        vy:rand(0.2,0.48), r:rand(2.4,4.2), life:1
      });
      popHearts(fx, fy, 4);
      keeperRep = clamp(keeperRep+4, 0, 100);
      lastFeedT = t;
    }

    function pickSwimGoal(f) {
      const spec = SPECIES[f.type] || SPECIES.neon;
      const lane = ((f.id||1) % 3);
      const x0 = 50 + lane * ((W-100)/3);
      const x1 = x0 + (W-100)/3;
      const waterTop = 96;
      const waterBot = spec.bottom ? floorY()-22 : floorY()-110;
      const y0 = clamp(H * (spec.depth?.[0] ?? 0.22), waterTop, waterBot-20);
      const y1 = clamp(H * (spec.depth?.[1] ?? 0.55), y0+8, waterBot);
      return {
        x: clamp(rand(x0, x1), 48, W-48),
        y: rand(y0, y1)
      };
    }
    function steerTo(f, gx, gy, pull) {
      const dx=gx-f.x, dy=gy-f.y, d=Math.hypot(dx,dy)||1;
      const arrive = clamp(d/80, 0.25, 1);
      f.vx += dx/d * pull * arrive;
      f.vy += dy/d * pull * arrive * 0.85;
      return d;
    }
    function avoidDecor(f) {
      if (f.action==="hide" || f._inHide) return;
      for (const h of hideSpots()) {
        const dx=f.x-h.x, dy=f.y-h.y, d2=dx*dx+dy*dy, r=h.r+f.size*0.4;
        if (d2<r*r && d2>1) {
          const d=Math.sqrt(d2);
          f.vx += dx/d*0.12; f.vy += dy/d*0.08;
        }
      }
    }
    function nearestFlake(f) {
      let best=null, bestD=1e9;
      for (const fl of flakes) {
        const d=(fl.x-f.x)**2+(fl.y-f.y)**2;
        if (d<bestD) { bestD=d; best=fl; }
      }
      return bestD < 210*210 ? best : null;
    }

    function updateFish(f) {
      const spec = SPECIES[f.type];
      f.phase += 0.12 + f.speed*0.08;
      f.hungry = Math.min(1, f.hungry + 0.00035);
      if (Math.random()<0.004) f.blink = 8;
      if (f.blink>0) f.blink--;
      const food = f.hungry>0.25 ? nearestFlake(f) : null;
      if (food) {
        const dx=food.x-f.x, dy=food.y-f.y, dist=Math.hypot(dx,dy)||1;
        f.vx += dx/dist*0.08; f.vy += dy/dist*0.06;
        if (dist < f.size*0.8) {
          food.life -= 0.35; f.hungry = Math.max(0, f.hungry-0.35);
          f.fedT = t;
          f.poopIn = 50 + (Math.random()*40|0);
          if (Math.random()<0.35) popHearts(f.x, f.y-8, 2);
        }
      } else if (f.hungry>0.55 && plants.length) {
        const p = plants[(f.id||0) % plants.length];
        const py = floorY() - Math.min(p.h*0.62, H*0.28);
        f.vx += (p.x-f.x)*0.012; f.vy += (py-f.y)*0.01;
        if (Math.hypot(p.x-f.x, py-f.y) < f.size+16) {
          f.hungry = Math.max(0, f.hungry-0.08);
          f.fedT = t;
          if (!f.poopIn) f.poopIn = 70 + (Math.random()*30|0);
          if (t%40===0) say(f,"food","🌿");
        }
      } else {
        f.goalT = (f.goalT||0) - 1;
        if (!f.swimTo || f.goalT<=0 || Math.hypot((f.swimTo.x-f.x),(f.swimTo.y-f.y))<18) {
          f.swimTo = pickSwimGoal(f);
          f.goalT = 80 + (Math.random()*160|0);
        }
        steerTo(f, f.swimTo.x, f.swimTo.y, 0.035);
        if (Math.random()<0.03) {
          const lo = spec.bottom ? floorY()-30 : 100;
          const hi = spec.bottom ? floorY()-18 : floorY()-80;
          f.targetY = clamp(H*rand(spec.depth[0], spec.depth[1]), lo, hi);
        }
        f.vy += ((f.targetY||f.swimTo.y)-f.y)*0.0015;
        let ax=0, ay=0, n=0, crowded=0;
        for (const o of fish) {
          if (o===f || o.dead) continue;
          const dx=o.x-f.x, dy=o.y-f.y, d2=dx*dx+dy*dy;
          const close = bonded(f,o);
          const minD=(f.size+o.size)*(close?0.7:1.35) + (close?18:36);
          if (d2<minD*minD && d2>1) {
            const d=Math.sqrt(d2); f.vx -= dx/d*(close?0.04:0.16); f.vy -= dy/d*(close?0.03:0.12);
            if (!close) crowded++;
          }
          if (spec.school && o.type===f.type && d2<120*120 && d2>70*70) {
            ax+=o.vx; ay+=o.vy; n++;
          }
        }
        if (n) { f.vx += (ax/n-f.vx)*0.008; f.vy += (ay/n-f.vy)*0.008; }
        if (crowded>2) { f.vx += rand(-0.25,0.25); f.vy += rand(-0.18,0.18); }
      }
      const max = f.speed*(food?1.75:1);
      const spd = Math.hypot(f.vx,f.vy);
      if (spd>max) { f.vx=f.vx/spd*max; f.vy=f.vy/spd*max; }
      f.vx *= 0.985; f.vy *= 0.98;
      avoidDecor(f);
      if (!food && Math.abs(f.vx)<0.12) f.vx += (f.vx>=0?1:-1)*0.03;
      if (weather==="current") f.vx += 0.035;
      if (weather==="cloudy" && Math.random()<0.01) f.action="sleep";
      if (keeperRep>70 && Math.random()<0.004) f.poseWant = 1;
      if (keeperRep<30 && Math.random()<0.006) f.poseWant = -1;
      f.x += f.vx + Math.sin(t*0.01)*0.12; f.y += f.vy + Math.sin(t*0.03+f.phase)*0.12;
      if (t%12===0) doJob(f);
      if (Math.random()<0.02) f.vz = (f.vz||0) + rand(-0.006,0.006);
      f.z = clamp((f.z||0.5) + (f.vz||0), 0.08, 1);
      if (f.z<=0.08 || f.z>=1) f.vz *= -1;
      if (scareT>0) {
        const p = plants[Math.abs(f.id||0)%Math.max(1,plants.length)];
        if (p) { f.vx += (p.x-f.x)*0.02; f.vy += (floorY()-40-f.y)*0.02; }
      }
      if (f.x < W*0.18 && f.y > floorY()-70) { // heater corner
        f.mood = clamp((f.mood||70)+0.02,0,100);
        if (Math.random()<0.01) f.action="rest";
      }
      const hid = nearestHide(f);
      if (hid && Math.hypot(f.x-hid.x, f.y-hid.y)<hid.r+6 && (f.action==="hide"||f.action==="sleep"||f._inHide)) {
        f._cave = true;
        f._hideId = hid.id;
        if (hid.id==="castle" && f.crewVibe) dayNews.castleCrew = f.crewVibe;
        f.hideT = (f.hideT||80) - 1;
        if (f.hideT<=0) { f._inHide=false; f._cave=false; f.action="wander"; f.hideT=0; f.swimTo=pickSwimGoal(f); f.vy-=0.4; say(f,"greet","✨"); }
        else { f._inHide = true; f.x += (hid.x-f.x)*0.08; f.y += (hid.y-f.y)*0.08; f.vx*=0.5; f.vy*=0.5; }
      } else { f._cave = false; f._inHide = false; }
      if (f.type==="betta" && Math.random()<0.004) {
        ripples.push({ x:f.x, y:90, r:4, life:1 });
      }
      if (thiefId && f.id===thiefId && flakes.length && Math.random()<0.02) {
        flakes.pop(); f.hungry = Math.max(0, f.hungry-0.2); f.poopIn = 55; if (Math.random()<0.2) tell(f.name+" snuck a flake 🤫");
      }
      const pad = 36+f.size;
      if (f.x<pad) { f.x=pad; f.vx=Math.abs(f.vx)+0.2; }
      if (f.x>W-pad) { f.x=W-pad; f.vx=-Math.abs(f.vx)-0.2; }
      if (f.x < 70) f.vx += 0.05;
      if (f.x > W-70) f.vx -= 0.05;
      if (f.y < 110) f.vy += 0.04;
      if (!spec.bottom && f.y > floorY()-120) f.vy -= 0.14;
      if (f.y > floorY()-70) f.vy -= spec.bottom ? 0.02 : 0.18;
      const top=78, bot = spec.bottom ? floorY()-18 : floorY()-100;
      if (f.y<top) { f.y=top; f.vy=Math.abs(f.vy); }
      if (f.y>bot) { f.y=bot; f.vy=-Math.abs(f.vy)*0.7; }
      updatePose(f);
      f.flip = (f.head||1) < 0;

      f.thinkIn = (f.thinkIn||0)-1;
      if (f.thinkIn<=0) {
        f.thinkIn = 40 + (Math.random()*100|0);
        const w = { wander:3, explore:2, rest:1, social:2, eat:1, friend:1, partner:1, fight:0.4, escape:0.3, play:1.5 };
        if ((f.hungry||0)>0.6) w.eat += 3;
        if ((f.mood||70)<35) { w.friend += 2; w.rest += 1.5; w.escape += 0.4; }
        if (f.married) w.partner += 4;
        if (f.friendId) w.friend += 2.2;
        if (f.crewId) w.social += 1.4;
        if (f.trait==="chaotic" || f.trait==="menace") { w.escape += 1.2; w.fight += 0.8; w.explore += 1; }
        if (f.trait==="chill" || f.trait==="sleepyhead") w.rest += 2;
        if (f.trait==="flirt" || f.trait==="romantic") w.social += 2;
        if (f.trait==="goofy" || f.trait==="bestie") { w.play += 2; w.friend += 1; }
        if (f.trait==="spicy" || f.type==="betta") w.fight += 1.2;
        if (f.goal && f.goal.id==="fame") w.escape += 0.8;
        if (f.baby) { w.fight = 0; w.escape *= 0.3; w.play += 1; }
        let sum = 0; for (const k in w) sum += w[k];
        let r = Math.random()*sum, pickA = "wander";
        for (const k in w) { r -= w[k]; if (r<=0) { pickA=k; break; } }
        f.action = pickA;
        if (pickA==="explore") {
          f.targetY = rand(90, floorY()-40);
          f.vx += rand(-0.6,0.6);
        }
        if (pickA==="play") say(f,"chat","🎮");
        const phase = dayPhase();
        if (phase==="night" && Math.random()<0.45) f.action="sleep";
        const mate = f.partner ? findById(f.partner) : (f.friendId ? findById(f.friendId) : null);
        if (mate && (mate.action==="sleep" || mate.action==="rest" || mate.action==="hide" || mate.action==="dance" || mate.action==="play")) {
          if (Math.random()<0.7) f.action = mate.action;
        }
        if (f.job==="guard" && Math.random()<0.25) f.action="hide";
        if (f.job==="napper" && Math.random()<0.3) f.action="sleep";
        if (f.job==="cleaner" && Math.random()<0.2) f.action="eat";
      }
      if (f.action==="sleep") {
        const D = deco();
        const spot = Math.random()<0.5 && opts.extras ? D.shroom : (plants[Math.abs(f.id||0)%Math.max(1,plants.length)] || D.shroom);
        f.vx += ((spot.x||spot.x)-f.x)*0.004;
        f.vy += ((spot.y||floorY()-28)-f.y)*0.004;
        f.vx *= 0.92; f.vy *= 0.92;
        if (Math.random()<0.01) say(f,"goal","😴");
      }
      if (f.action==="hide") {
        const dest = nearestHide(f) || deco().castle;
        f.vx += (dest.x-f.x)*0.008; f.vy += (dest.y-f.y)*0.008;
        if (!f.hideT) f.hideT = 90 + (Math.random()*80|0);
      }
      if ((f.rank==="monarch" || f.rank==="boss" || f.job==="guard") && (f.action==="wander"||f.action==="rest")) {
        const c = deco().castle;
        f.vx += (c.x - f.x)*0.003;
        f.vy += (c.y - 10 - f.y)*0.002;
        if (Math.hypot(f.x-c.x, f.y-c.y)<40 && Math.random()<0.02) { f.action="hide"; f.hideT=140; }
      }
      if (f.job==="chef" && f.action==="wander") {
        f.vx += (deco().chest.x - f.x)*0.0012;
      }
      if (f.job==="gossip" && Math.random()<0.004) tell(f.name+" spilled tea 🎭");
      if (f.action==="explore") {
        f.vy += (f.targetY - f.y)*0.003;
        if (Math.random()<0.02) f.vx += rand(-0.3,0.3);
      }
      if (f.action==="play") {
        f.vx += Math.sin(t*0.1+f.phase)*0.04;
        f.vy += Math.cos(t*0.12+f.phase)*0.03;
      }
      if (f.action==="fight" && !f.baby) {
        let rival = null, best=90*90;
        for (const o of liveFish()) {
          if (o===f || o.baby || o.dead) continue;
          if (o.id===f.partner || o.id===f.friendId) continue;
          const same = o.type===f.type || f.type==="betta" || o.type==="betta";
          if (!same) continue;
          const d=(o.x-f.x)**2+(o.y-f.y)**2;
          if (d<best) { best=d; rival=o; }
        }
        if (rival) {
          f.vx += (rival.x-f.x)*0.01; f.vy += (rival.y-f.y)*0.008;
          if (best < 28*28) {
            f.vx += (f.x-rival.x)*0.08; rival.vx += (rival.x-f.x)*0.08;
            f.mood = clamp(f.mood-1.2,0,100);
            say(f,"drama","💢"); say(rival,"drama","😤");
            dayNews.fights++;
            if (!stickers.fight) { stickers.fight = true; tell(f.name+" scuffled with "+rival.name); saveTank(); }
            if (f.type==="betta" && rival.type==="betta" && f.fightT>30) {
              f.action = rival.action = "dance"; f.danceT = rival.danceT = 120;
              tell(f.name+" and "+rival.name+" dance-off 💃"); slowMo(80);
            }
            f.fightT = (f.fightT||0)+1;
            if (f.fightT>50) {
              f.wins = (f.wins||0)+1; rival.mood = clamp((rival.mood||70)-8,0,100);
              f.action="wander"; f.fightT=0; f.cool=200;
            }
          }
        } else f.action="wander";
      }
      f.mood = clamp((f.mood||70) + (f.action==="rest"?0.02:-0.004) + ((f.hungry||0)>0.8?-0.02:0), 0, 100);

      if (f.action==="escape") {
        f.escapeT = (f.escapeT||0)+1;
        f.vx += f.x < W/2 ? -0.05 : 0.05;
        if (f.x<28 || f.x>W-28) {
          f.x = clamp(f.x, 26, W-26);
          f.vx *= -1.4;
          say(f,"bye","🪟");
          dayNews.escapes++;
          wanted = f.name;
          logEvent("🚨", "Wanted", f.name+" tried the glass");
          if (!stickers.escape) { stickers.escape = true; tell(f.name+" tried the glass 🚪"); saveTank(); }
          slowMo(70);
          if (f.escapeT>90) { f.action="wander"; f.escapeT=0; f.mood=clamp(f.mood-8,0,100); }
        }
      }
      if (f.action==="dance" || f.danceT>0) {
        f.danceT = Math.max(0,(f.danceT||0)-1);
        const p = findById(f.partner);
        if (p) {
          const style = f.type==="betta"||p.type==="betta" ? "flare" : f.type==="angel" ? "rise" : f.type==="cory" ? "gravel" : "circle";
          if (style==="flare") {
            f.vx += (p.x + (f.sex==="M"?14:-14) - f.x)*0.03;
            f.vy += (p.y - f.y)*0.02;
            if (t%20===0) say(f,"flirt","💃");
          } else if (style==="rise") {
            f.vy -= 0.04;
            f.vx += (p.x-f.x)*0.02;
          } else if (style==="gravel") {
            const nx=f.nestX||W/2, ny=f.nestY||floorY()-12;
            f.vx += (nx-f.x)*0.03; f.vy += (ny-f.y)*0.03;
          } else {
            const ang = t*0.08 + f.id;
            f.vx += (p.x + Math.cos(ang)*18 - f.x)*0.02;
            f.vy += (p.y + Math.sin(ang)*10 - f.y)*0.02;
          }
        }
        if (f.danceT===1 && f.sex==="F" && liveFish().length < opts.maxFish) {
          const dadId = f.partner;
          const nx = f.nestX || f.x, ny = f.nestY || floorY()-10;
          eggs.push({ x:nx, y:ny, type:f.type, age:0, hatch: 320+rand(0,160), momId:f.id, dadId, guardId:dadId });
          eggs.push({ x:nx+rand(-10,10), y:ny+rand(-4,4), type:f.type, age:0, hatch: 360+rand(0,160), momId:f.id, dadId, guardId:dadId });
          say(f,"love","🥚");
          tell(f.name+" laid eggs at the nest");
          logEvent("🥚", "Nest", f.name+" laid eggs");
          /* nest stays on the scrapbook, no camera steal */
          f.cool = 900;
          const dad = findById(dadId);
          if (dad) { dad.action="hide"; dad.guardEgg=true; }
        }
        if (f.danceT===0) f.action="partner";
      }
      if (f.married && f.partner) {
        const p = findById(f.partner);
        if (p) {
          const d = Math.hypot(p.x-f.x, p.y-f.y);
          if (d>38) { f.vx += (p.x - f.x) * 0.006; f.vy += (p.y - f.y) * 0.005; }
          if (p.action==="sleep" || p.action==="rest" || p.action==="hide" || p.action==="play" || p.action==="dance") {
            if (Math.random()<0.02) f.action = p.action;
          }
        } else {
          f.married = false; f.partner = null; f.mood = Math.min(f.mood, 22);
          f.action="rest"; say(f,"drama","💔");
        }
      }
      if (f.action==="friend" && f.friendId) {
        const fr = findById(f.friendId);
        if (fr) {
          const d = Math.hypot(fr.x-f.x, fr.y-f.y);
          if (d>48) { f.vx += (fr.x-f.x)*0.004; f.vy += (fr.y-f.y)*0.003; }
          if (fr.action==="sleep" || fr.action==="play") f.action = fr.action;
          f.mood=clamp(f.mood+0.03,0,100);
        }
        else { f.friendId=null; f.mood=clamp(f.mood-12,0,100); say(f,"drama","😢"); }
      }

      if (!opts.life) return;
      f.age += 1;
      f.cool = Math.max(0, f.cool-1);
      if (f.adult) {
        const targetGrow = f.age < 900 ? 0.28 + (f.age/900)*0.72 : 1;
        f.grow += (Math.min(1, targetGrow) - (f.grow||1)) * 0.012;
        f.size = f.adult * f.grow;
        if (f.grow > 0.92) f.baby = false;
      }
      if (f.poopIn>0) {
        f.poopIn--;
        if (f.poopIn===0) {
          poops.push({ x:f.x, y:f.y+f.size*0.2, vy:0.18+Math.random()*0.12, life:1, r:2+Math.random()*1.4 });
          if (Math.random()<0.55) say(f, "poop");
        }
      }
      if (f.age > f.life) {
        if (!f._logged) { f._logged=true; addAlbum(f, "passed on"); tell(f.name+" became a legend", false); }
        f.dead = Math.min(40, (f.dead||0)+1);
        return;
      }
      if (f.guardEgg) {
        const clutch = eggs.filter(e => e.guardId===f.id && !e.done);
        if (clutch.length) {
          f.vx += (clutch[0].x-f.x)*0.02;
          f.vy += (clutch[0].y-8-f.y)*0.02;
        } else f.guardEgg = false;
      }
    }

    function drawBackground() {
      const th = theme();
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, th.top); g.addColorStop(0.55, th.mid); g.addColorStop(1, th.bot);
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      const phase = dayPhase();
      if (phase==="morning") { ctx.fillStyle="rgba(255,220,180,0.12)"; ctx.fillRect(0,0,W,H); }
      if (phase==="noon") { ctx.fillStyle="rgba(255,255,255,0.06)"; ctx.fillRect(0,0,W,H); }
      if (phase==="night") { ctx.fillStyle="rgba(20,16,50,0.28)"; ctx.fillRect(0,0,W,H); }
      if (phase==="festival") { ctx.fillStyle="rgba(255,180,80,0.1)"; ctx.fillRect(0,0,W,H); }
      const avg = liveFish().length ? liveFish().reduce((s,f)=>s+(f.mood||70),0)/liveFish().length : 70;
      if (avg<45) { ctx.fillStyle="rgba(80,80,110,0.18)"; ctx.fillRect(0,0,W,H); }
      const light = ctx.createRadialGradient(W*0.5, 10, 8, W*0.5, 30, H*0.65);
      light.addColorStop(0,"rgba(255,255,255,0.32)"); light.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle = light; ctx.fillRect(0,0,W,H);
      if (opts.theme==="night") {
        ctx.fillStyle="#fff7c8";
        for (let i=0;i<36;i++) {
          ctx.globalAlpha = 0.3+Math.sin(t*0.03+i)*0.2;
          ctx.beginPath(); ctx.arc((i*89+t*0.04)%W, (i*47)%(H*0.5), 1.4, 0, 6.28); ctx.fill();
        }
        ctx.globalAlpha=1;
      }
      const fy = floorY();
      ctx.fillStyle = "rgba(20,30,50,0.12)";
      ctx.beginPath(); ctx.moveTo(18, 70); ctx.lineTo(W-18, 70); ctx.lineTo(W-8, fy); ctx.lineTo(8, fy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = th.gravel[0]; ctx.fillRect(0, fy-10, W, H-(fy-10));
      for (const p of pebbles) {
        ctx.fillStyle = th.gravel[(p.x|0)%3];
        ctx.beginPath(); ctx.ellipse(p.x, fy-8+((p.x|0)%5)-2, p.r, p.r*0.7, 0, 0, 6.28); ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(0, 64, W, 8);
      drawCaustics();
    }
    function drawGlass() {
      const g = 10;
      ctx.save();
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 3;
      ctx.strokeRect(g, 56, W-g*2, floorY()-48);
      ctx.strokeStyle = "rgba(80,50,70,0.22)";
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 50, W-8, floorY()-40);
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.fillRect(14, 60, 10, floorY()-56);
      ctx.fillStyle = "rgba(255,255,255,0.07)";
      ctx.fillRect(W-22, 60, 8, floorY()-56);
      ctx.fillStyle = "rgba(180,220,255,0.08)";
      ctx.fillRect(g, 56, W-g*2, 10);
      const fres = ctx.createLinearGradient(0,56,0,90);
      fres.addColorStop(0,"rgba(255,255,255,0.22)");
      fres.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle = fres;
      ctx.fillRect(g, 56, W-g*2, 18);
      ctx.restore();
    }

    function deco() {
      const fy = floorY();
      if (!decoLayout) shuffleLayout();
      const L = decoLayout;
      const spot = (k, hide) => ({ x: L[k].x, y: fy - L[k].yOff, hide: !!hide });
      return {
        castle: spot("castle", true),
        cave: spot("cave", true),
        log: spot("log", true),
        chest: spot("chest", true),
        log2: spot("log2", true),
        caveR: spot("caveR", true),
        cat: spot("cat", false),
        shroom: spot("shroom", false),
        star: spot("star", false),
        photo: spot("photo", false),
        hammock: spot("hammock", true)
      };
    }
    function hideSpots() {
      const D = deco();
      const list = [];
      if (opts.castle) list.push({ id:"castle", x:D.castle.x, y:D.castle.y, r:34 });
      list.push({ id:"cave", x:D.cave.x, y:D.cave.y, r:16 });
      list.push({ id:"log", x:D.log.x, y:D.log.y, r:18 });
      if (opts.chest) list.push({ id:"chest", x:D.chest.x, y:D.chest.y-4, r:16 });
      list.push({ id:"log2", x:D.log2.x, y:D.log2.y, r:16 });
      list.push({ id:"caveR", x:D.caveR.x, y:D.caveR.y, r:16 });
      list.push({ id:"hammock", x:D.hammock.x, y:D.hammock.y, r:20 });
      for (const p of plants) list.push({ id:"plant"+p.x, x:p.x, y:floorY()-Math.min(36,p.h*0.45), r:14 });
      return list;
    }
    function nearestHide(e) {
      let best=null, bd=1e9;
      for (const h of hideSpots()) {
        const d=(h.x-e.x)**2+(h.y-e.y)**2;
        if (d<bd) { bd=d; best=h; }
      }
      return best;
    }

    function drawPlants() {
      const [h,s,l] = theme().plant;
      const leaf = (hh,ss,ll) => `hsla(${hh},${ss}%,${ll}%,0.92)`;
      for (const p of plants) {
        const base = floorY()-6;
        const sway = (i) => Math.sin(t*0.02+p.phase+i*0.28)*(3+i*0.55);
        const kind = p.kind || "kelp";
        if (kind==="grass") {
          for (let b=0;b<5;b++) {
            ctx.strokeStyle = leaf(h,s,l+b*2); ctx.lineWidth=3; ctx.lineCap="round";
            ctx.beginPath(); ctx.moveTo(p.x-8+b*4, base);
            ctx.quadraticCurveTo(p.x-8+b*4+sway(2), base-p.h*0.5, p.x-6+b*4+sway(4), base-p.h*0.7);
            ctx.stroke();
          }
        } else if (kind==="anubias") {
          ctx.fillStyle="#c9b48a"; ctx.beginPath(); ctx.ellipse(p.x, base-4, 10, 6, 0,0,6.28); ctx.fill();
          for (let i=0;i<4;i++) {
            const xx=p.x-10+i*7+sway(i)*0.3, yy=base-16-i*5;
            ctx.fillStyle=leaf(h+8,s-10,l+8);
            ctx.beginPath(); ctx.ellipse(xx, yy, 8, 5, -0.4+i*0.2, 0,6.28); ctx.fill();
          }
        } else if (kind==="lily") {
          ctx.fillStyle=leaf(h,s,l+6);
          ctx.beginPath(); ctx.ellipse(p.x, base-8, 16, 7, 0,0,6.28); ctx.fill();
          ctx.fillStyle="#ff8ab0";
          for (let i=0;i<5;i++) {
            const a=-Math.PI/2+i*1.256;
            ctx.beginPath(); ctx.ellipse(p.x+Math.cos(a)*6, base-18+Math.sin(a)*4, 4, 2.4, a,0,6.28); ctx.fill();
          }
          ctx.fillStyle="#ffe38a"; ctx.beginPath(); ctx.arc(p.x, base-18, 2.4,0,6.28); ctx.fill();
        } else if (kind==="java") {
          ctx.strokeStyle=leaf(h,s,l); ctx.lineWidth=4; ctx.lineCap="round";
          ctx.beginPath(); ctx.moveTo(p.x, base);
          ctx.quadraticCurveTo(p.x+sway(2), base-p.h*0.4, p.x+sway(4), base-p.h*0.75);
          ctx.stroke();
          for (let i=2;i<7;i++) {
            const yy=base-(p.h*i)/8, xx=p.x+sway(i);
            ctx.fillStyle=leaf(h,s,l+10);
            ctx.beginPath(); ctx.ellipse(xx-7, yy, 6, 3.2, -0.7,0,6.28); ctx.fill();
            ctx.beginPath(); ctx.ellipse(xx+7, yy+1, 5.5, 3, 0.7,0,6.28); ctx.fill();
          }
        } else {
          ctx.strokeStyle = leaf(h,s,l);
          ctx.lineWidth = Math.max(6, p.w*0.7); ctx.lineCap="round";
          ctx.beginPath(); ctx.moveTo(p.x, base);
          for (let i=1;i<=p.segs;i++) ctx.lineTo(p.x + sway(i), base-(p.h*i)/p.segs);
          ctx.stroke();
          ctx.fillStyle="#ff8ab0";
          ctx.beginPath(); ctx.arc(p.x+sway(p.segs), base-p.h-1, 2.6, 0, 6.28); ctx.fill();
        }
        const hiders = liveFish().filter(f => f.action==="hide" && Math.hypot(f.x-p.x,f.y-(base-p.h*0.4))<18);
        if (hiders.length && t%180===0) say(hiders[0],"goal","🌿");
      }
    }

    function drawRocks() {
      const fy = floorY();
      const tones = ["#d8c4b8","#cbb6aa","#e4d4c8","#bca898"];
      for (const r of rocks) {
        for (let i=0;i<(r.stack||2);i++) {
          const rx = r.x + (i-1)*10*r.s, ry = fy-8-i*9*r.s, rr=12*r.s+i*2;
          ctx.fillStyle = tones[i%tones.length];
          ctx.beginPath(); ctx.ellipse(rx, ry, rr, rr*0.62, 0,0,6.28); ctx.fill();
          ctx.fillStyle="rgba(255,248,242,0.35)";
          ctx.beginPath(); ctx.ellipse(rx-3, ry-2, rr*0.35, rr*0.18, -0.4,0,6.28); ctx.fill();
        }
      }
    }

    function drawLog(log, flip) {
      ctx.fillStyle="#c48a5a";
      ctx.beginPath(); ctx.roundRect(log.x-26, log.y-10, 52, 16, 8); ctx.fill();
      ctx.fillStyle="#7a4a30";
      ctx.beginPath(); ctx.ellipse(log.x+(flip?26:-26), log.y-2, 7, 8, 0,0,6.28); ctx.fill();
      ctx.fillStyle="#3a2418";
      ctx.beginPath(); ctx.ellipse(log.x+(flip?26:-26), log.y-2, 4, 5, 0,0,6.28); ctx.fill();
      ctx.fillStyle="rgba(255,248,242,0.25)";
      ctx.beginPath(); ctx.ellipse(log.x, log.y-6, 14, 3, 0,0,6.28); ctx.fill();
    }
    function drawCaveMouth(cave) {
      ctx.fillStyle="#c4a090";
      ctx.beginPath(); ctx.ellipse(cave.x, cave.y+4, 20, 11, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle="#6a4a58";
      ctx.beginPath(); ctx.ellipse(cave.x, cave.y+2, 11, 7, 0, Math.PI, 0); ctx.fill();
    }
    function drawHides() {
      const D = deco(), fy = floorY();
      drawCaveMouth(D.cave);
      drawCaveMouth(D.caveR);
      drawLog(D.log, false);
      drawLog(D.log2, true);
      ctx.strokeStyle="#8fbf88"; ctx.lineWidth=2.2; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(D.hammock.x-18, D.hammock.y+8);
      ctx.quadraticCurveTo(D.hammock.x, D.hammock.y-6, D.hammock.x+18, D.hammock.y+8); ctx.stroke();
      ctx.fillStyle="#9fd49a";
      ctx.beginPath(); ctx.ellipse(D.hammock.x, D.hammock.y+6, 16, 5, 0,0,6.28); ctx.fill();
      ctx.fillStyle="#d8a070";
      ctx.beginPath(); ctx.ellipse(D.castle.x-36, fy-8, 14, 7, 0,0,6.28); ctx.fill();
      ctx.fillStyle="rgba(255,160,90,0.18)";
      ctx.beginPath(); ctx.ellipse(D.castle.x-36, fy-16, 8, 16, 0,0,6.28); ctx.fill();
    }

    function drawCastle() {
      if (!opts.castle) return;
      const {x} = deco().castle;
      const fy = floorY();
      const guests = allAlive().filter(e => e._hideId==="castle" || Math.hypot(e.x-x, e.y-(fy-28))<40);
      const royal = guests.some(e => e.rank==="monarch" || e.rank==="boss");
      const bob = Math.sin(t*0.04)*2;
      const flag = Math.sin(t*0.08)*8;
      ctx.fillStyle = "#f7d4de";
      ctx.beginPath(); ctx.roundRect(x-46, fy-78+bob*0.15, 92, 78, 12); ctx.fill();
      ctx.fillStyle = "#ff9bb8";
      ctx.beginPath(); ctx.roundRect(x-54, fy-92+bob, 108, 16, 8); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x-62, fy-52, 20, 52, 8); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x+42, fy-60, 20, 60, 8); ctx.fill();
      ctx.fillStyle = "#ffe38a";
      ctx.beginPath(); ctx.arc(x-50, fy-92+bob, 6, 0,6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(x+50, fy-92+bob, 6, 0,6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(x, fy-96+bob, 7, 0,6.28); ctx.fill();
      const doorOpen = guests.length ? 8 : 2+Math.sin(t*0.05)*2;
      ctx.fillStyle = guests.length ? "#3a2430" : "#8fd3e8";
      ctx.beginPath(); ctx.roundRect(x-16, fy-32, 32, 32, 10); ctx.fill();
      ctx.beginPath(); ctx.arc(x, fy-32, 16, Math.PI, 0); ctx.fill();
      ctx.fillStyle="#ffd0dc";
      ctx.beginPath(); ctx.roundRect(x-16-doorOpen, fy-30, 8, 28, 3); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x+8+doorOpen, fy-30, 8, 28, 3); ctx.fill();
      const winGlow = royal || dayPhase()==="night" || dayPhase()==="festival";
      ctx.fillStyle = winGlow ? `rgba(255,220,120,${0.55+Math.sin(t*0.1)*0.25})` : "#fff6fa";
      ctx.beginPath(); ctx.roundRect(x-30, fy-64, 12, 12, 3); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x+18, fy-64, 12, 12, 3); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x-8, fy-72, 16, 10, 3); ctx.fill();
      ctx.strokeStyle="#ffd0dc"; ctx.lineWidth=1.4;
      ctx.strokeRect(x-30, fy-64, 12, 12); ctx.strokeRect(x+18, fy-64, 12, 12);
      ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(x+6, fy-96+bob); ctx.lineTo(x+6, fy-118+bob); ctx.stroke();
      ctx.fillStyle="#ff6b8a";
      ctx.beginPath();
      ctx.moveTo(x+6, fy-118+bob);
      ctx.quadraticCurveTo(x+18+flag, fy-112+bob, x+6, fy-104+bob);
      ctx.fill();
      if (royal) {
        ctx.font="16px sans-serif"; ctx.textAlign="center";
        ctx.fillText("👑", x, fy-128+bob+Math.sin(t*0.1)*2);
      }
      if (guests.length && t%160===0) tell((royal?"Royalty home · ":"")+guests[0].name+" in the castle", false);
    }

    function drawChest() {
      if (!opts.chest) return;
      const {x,y} = deco().chest;
      const guests = allAlive().filter(e => e._hideId==="chest" || Math.hypot(e.x-x,e.y-y)<22);
      const open = guests.length ? 6 : Math.sin(t*0.05)*1.2;
      ctx.fillStyle = "#e09a4a";
      ctx.beginPath(); ctx.roundRect(x-16, y-4, 32, 14, 4); ctx.fill();
      ctx.fillStyle = "#f4c86a";
      ctx.beginPath(); ctx.roundRect(x-16, y-16-open, 32, 12, 5); ctx.fill();
      ctx.fillStyle = "#ffe38a";
      ctx.beginPath(); ctx.arc(x, y-6-open*0.3, 3.2, 0, 6.28); ctx.fill();
      if (guests.length) {
        ctx.fillStyle="#fff6fb";
        ctx.beginPath(); ctx.arc(x, y-22-open, 3, 0, 6.28); ctx.fill();
      }
    }

    function drawLanterns() {
      if (!opts.lanterns) return;
      const n = Math.max(2, Math.floor(W/220));
      const night = dayPhase()==="night" || dayPhase()==="festival";
      for (let i=0;i<n;i++) {
        const x = 40 + i*(W-70)/Math.max(1,n-1);
        const y = 78 + Math.sin(t*(dayPhase()==="festival"?0.06:0.025)+i)*5;
        ctx.strokeStyle="rgba(90,58,74,0.3)"; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(x,8); ctx.lineTo(x,y-16); ctx.stroke();
        ctx.fillStyle = night ? "#ffd36a" : "#ff8aa8";
        ctx.beginPath(); ctx.roundRect(x-10, y-18, 20, 26, 8); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,0.45)";
        ctx.beginPath(); ctx.roundRect(x-6, y-12, 6, 12, 3); ctx.fill();
        ctx.fillStyle = night ? "rgba(255,210,80,0.2)" : "rgba(255,140,170,0.12)";
        ctx.beginPath(); ctx.arc(x, y, 18+Math.sin(t*0.08+i)*3, 0, 6.28); ctx.fill();
        if (night) {
          for (const f of liveFish()) {
            if (Math.hypot(f.x-x, f.y-y)<70 && Math.random()<0.01) { f.vx += (x-f.x)*0.002; f.vy += (y+20-f.y)*0.002; }
          }
        }
      }
    }

    function drawCat() {
      if (!opts.cat) return;
      const {x,y} = deco().cat;
      const near = allAlive().filter(e => Math.hypot(e.x-x, e.y-y)<48);
      const wave = Math.sin(t*(near.length?0.18:0.08));
      ctx.save();
      ctx.globalAlpha = 0.88;
      ctx.translate(x, y);
      ctx.scale(0.82, 0.82);
      ctx.translate(-x, -y);
      ctx.fillStyle="#d8c4b8";
      ctx.beginPath(); ctx.ellipse(x, floorY()-8, 18, 8, 0,0,6.28); ctx.fill();
      ctx.fillStyle="#fff8f4";
      ctx.beginPath(); ctx.ellipse(x, y+6, 16, 14, 0,0,6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y-12, 12, 0,6.28); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x-9,y-18); ctx.lineTo(x-6,y-30); ctx.lineTo(x-2,y-16); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x+9,y-18); ctx.lineTo(x+6,y-30); ctx.lineTo(x+2,y-16); ctx.fill();
      ctx.fillStyle="#ffb3c9";
      ctx.beginPath(); ctx.moveTo(x-7,y-20); ctx.lineTo(x-6,y-26); ctx.lineTo(x-4,y-18); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x+7,y-20); ctx.lineTo(x+6,y-26); ctx.lineTo(x+4,y-18); ctx.fill();
      ctx.fillStyle="#ff8ab0";
      ctx.beginPath(); ctx.roundRect(x-8, y+2, 16, 10, 4); ctx.fill();
      ctx.fillStyle="#ffe38a";
      ctx.beginPath(); ctx.arc(x, y+7, 4.2, 0,6.28); ctx.fill();
      ctx.fillStyle="#5a3a4a";
      ctx.beginPath(); ctx.arc(x-4, y-14, 1.8, 0,6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(x+4, y-14, 1.8, 0,6.28); ctx.fill();
      ctx.fillStyle="#ff9bb8";
      ctx.beginPath(); ctx.ellipse(x, y-9, 2.2, 1.5, 0,0,6.28); ctx.fill();
      ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(x, y-8, 3.2, 0.2, Math.PI-0.2); ctx.stroke();
      ctx.fillStyle="#fff8f4";
      ctx.beginPath(); ctx.ellipse(x-14, y+4, 5, 4, 0.2,0,6.28); ctx.fill();
      ctx.save();
      ctx.translate(x+13, y-8 + wave*4);
      ctx.rotate(-0.7 + wave*0.5);
      ctx.beginPath(); ctx.ellipse(0,0,5,11,0,0,6.28); ctx.fill();
      ctx.fillStyle="#ffb3c9";
      ctx.beginPath(); ctx.ellipse(0,4,3,3.5,0,0,6.28); ctx.fill();
      ctx.restore();
      ctx.restore();
      if (near.length) {
        near.forEach(e => e.mood = clamp((e.mood||70)+0.05, 0, 100));
        if (t%160===0) { say(near[0],"greet","🐱"); popHearts(x, y-28, 3); }
      }
    }

    function drawPetals() {
      if (!opts.petals) return;
      for (const p of petals) {
        const fest = dayPhase()==="festival";
        p.y += p.s * (fest?1.85:1);
        p.x += Math.sin(t*0.02+p.rot)*(fest?0.7:0.35);
        p.rot += p.spin * (fest?1.6:1);
        if (p.y>H+8) { p.y=-8; p.x=rand(0,W); }
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle = opts.theme==="matcha" ? "#f7c8d4" : "#ffb7c8";
        ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*0.55,0,0,6.28); ctx.fill();
        ctx.restore();
      }
    }

    function drawBubbles() {
      ctx.fillStyle="rgba(255,255,255,0.38)";
      for (const b of bubbles) {
        b.y -= b.s; b.x += Math.sin((t+b.x)*0.02)*0.14;
        if (b.y<-8) { b.y=floorY()-8; b.x=rand(18,W-18); }
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.fill();
      }
    }

    function drawFlakes() {
      for (const fl of flakes) {
        fl.y += fl.vy; fl.x += Math.sin(t*0.05+fl.x)*0.12;
        if (fl.y>floorY()-8) fl.life -= 0.01;
        ctx.globalAlpha = clamp(fl.life,0,1);
        ctx.fillStyle="#ffd36a";
        ctx.beginPath(); ctx.arc(fl.x,fl.y,fl.r,0,6.28); ctx.fill();
      }
      ctx.globalAlpha=1;
      flakes = flakes.filter(f => f.life>0 && f.y<H-8);
    }

    function blush(s) {
      if (!opts.blush) return;
      ctx.fillStyle=BLUSH;
      ctx.beginPath(); ctx.ellipse(s*0.15, s*0.12, s*0.11, s*0.06, 0,0,6.28); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s*0.45, s*0.12, s*0.11, s*0.06, 0,0,6.28); ctx.fill();
    }

    function faceMood(ent) {
      if (!ent) return "happy";
      if (ent.dead) return "x";
      if (ent.action==="sleep") return "sleep";
      if (ent.action==="fight") return "mad";
      if (ent.action==="dance" || ent.action==="play") return "sparkle";
      if (ent.married && ent.action==="partner") return "love";
      if ((ent.mood||70)<28) return "sad";
      if ((ent.mood||70)<45) return "wobbly";
      if ((ent.hungry||0)>0.8) return "beg";
      if (ent.action==="escape") return "shock";
      if ((ent.mood||70)>85) return "sparkle";
      return "happy";
    }
    function drawMouth(mx, my, r, mood) {
      ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.5; ctx.lineCap="round";
      ctx.beginPath();
      if (mood==="sad" || mood==="wobbly") ctx.arc(mx, my+r*0.8, r, Math.PI+0.2, -0.2);
      else if (mood==="mad") { ctx.moveTo(mx-r, my); ctx.lineTo(mx+r, my); }
      else if (mood==="shock" || mood==="beg") { ctx.fillStyle="#5a3a4a"; ctx.beginPath(); ctx.ellipse(mx,my+r*0.2,r*0.55,r*0.7,0,0,6.28); ctx.fill(); return; }
      else if (mood==="love") { ctx.fillStyle="#ff7aa2"; ctx.beginPath(); ctx.moveTo(mx,my+r*0.4); ctx.bezierCurveTo(mx-r,my-r*0.4,mx-r*0.2,my-r,mx,my-r*0.2); ctx.bezierCurveTo(mx+r*0.2,my-r,mx+r,my-r*0.4,mx,my+r*0.4); ctx.fill(); return; }
      else if (mood==="sleep") { ctx.moveTo(mx-r*0.6,my); ctx.quadraticCurveTo(mx,my+r*0.3,mx+r*0.6,my); }
      else ctx.arc(mx, my, r, 0.2, Math.PI-0.2);
      ctx.stroke();
    }
    function cuteFace(s, ent) {
      const mood = faceMood(ent);
      const blink = (ent&&ent.blink)||0;
      if (mood!=="mad" && mood!=="sad") blush(s);
      const eye = (x, brow) => {
        if (mood==="sleep" || blink>3) {
          ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.8; ctx.lineCap="round";
          ctx.beginPath(); ctx.moveTo(x-s*0.08,-s*0.02); ctx.quadraticCurveTo(x,-s*0.01,x+s*0.08,-s*0.02); ctx.stroke();
        } else if (mood==="sparkle" || mood==="love") {

          ctx.beginPath(); ctx.arc(x, -s*0.04, s*0.055, 0, 6.28); ctx.fill();
          ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.3;
          ctx.beginPath(); ctx.arc(x, -s*0.04, s*0.09, 0.2, Math.PI-0.3); ctx.stroke();
        } else if (mood==="mad") {
          ctx.fillStyle="#fff"; ctx.beginPath(); ctx.ellipse(x,-s*0.04,s*0.09,s*0.08,0,0,6.28); ctx.fill();
          ctx.fillStyle="#5a3a4a"; ctx.beginPath(); ctx.arc(x,-s*0.03,s*0.05,0,6.28); ctx.fill();
          ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.6;
          ctx.beginPath(); ctx.moveTo(x-s*0.1,-s*0.14); ctx.lineTo(x+s*0.06,-s*0.08); ctx.stroke();
        } else if (mood==="sad" || mood==="wobbly") {
          ctx.fillStyle="#fff"; ctx.beginPath(); ctx.ellipse(x,-s*0.03,s*0.09,s*0.11,0,0,6.28); ctx.fill();
          ctx.fillStyle="#5a3a4a"; ctx.beginPath(); ctx.arc(x,-s*0.01,s*0.055,0,6.28); ctx.fill();
          ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.4;
          ctx.beginPath(); ctx.moveTo(x-s*0.08,-s*0.14); ctx.quadraticCurveTo(x,-s*0.1,x+s*0.08,-s*0.12); ctx.stroke();
        } else {
          ctx.fillStyle="#fff";
          ctx.beginPath(); ctx.ellipse(x, -s*0.05, s*0.1, s*0.12, 0,0,6.28); ctx.fill();
          ctx.fillStyle="#5a3a4a";
          ctx.beginPath(); ctx.arc(x+s*0.01, -s*0.04, s*0.07, 0, 6.28); ctx.fill();
          ctx.fillStyle="#fff";
          ctx.beginPath(); ctx.arc(x+s*0.035, -s*0.07, s*0.03, 0, 6.28); ctx.fill();

    function cuteFaceFront(s, ent) {
      const mood = faceMood(ent);
      if (mood!=="mad") {
        ctx.fillStyle="rgba(255,120,160,0.45)";
        ctx.beginPath(); ctx.ellipse(-s*0.22, s*0.08, s*0.1, s*0.05, 0,0,6.28); ctx.fill();
        ctx.beginPath(); ctx.ellipse(s*0.22, s*0.08, s*0.1, s*0.05, 0,0,6.28); ctx.fill();
      }
      cuteFace.front = true;
      const blink = (ent&&ent.blink)||0;
      const eye = (x) => {
        if (mood==="sleep" || blink>3) {
          ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.8;
          ctx.beginPath(); ctx.moveTo(x-s*0.09,-s*0.04); ctx.quadraticCurveTo(x,-s*0.02,x+s*0.09,-s*0.04); ctx.stroke();
        } else if (mood==="sparkle" || mood==="love") {
          ctx.fillStyle="#5a3a4a"; ctx.beginPath(); ctx.arc(x,-s*0.05,s*0.06,0,6.28); ctx.fill();
          ctx.strokeStyle="#5a3a4a"; ctx.beginPath(); ctx.arc(x,-s*0.05,s*0.1,0.15,Math.PI-0.2); ctx.stroke();

          ctx.fillStyle="#5a3a4a"; ctx.beginPath(); ctx.arc(x,-s*0.04,s*0.055,0,6.28); ctx.fill();
          ctx.beginPath(); ctx.moveTo(x-s*0.1,-s*0.16); ctx.lineTo(x+s*0.08,-s*0.08); ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.6; ctx.stroke();
        } else {
          ctx.fillStyle="#fff";

          ctx.beginPath(); ctx.arc(x, -s*0.05, s*0.075, 0, 6.28); ctx.fill();
          ctx.fillStyle="#fff";
          ctx.beginPath(); ctx.arc(x+s*0.03, -s*0.08, s*0.03, 0, 6.28); ctx.fill();

    function wag() { return Math.sin(t * 0.28); }

    function tailFin(s, color, fancy=false) {
      const w = wag();
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(-s*0.38, 0);
      ctx.quadraticCurveTo(-s*0.85, -s*0.38, -s*(1.05+ (fancy?0.18:0)), -s*0.06 + w*3);
      ctx.quadraticCurveTo(-s*0.7, 0, -s*(1.05+(fancy?0.18:0)), s*0.06 + w*2);
      ctx.quadraticCurveTo(-s*0.85, s*0.38, -s*0.38, 0);
      ctx.fill();
      if (fancy) {
        ctx.strokeStyle="rgba(255,255,255,0.35)";
        ctx.lineWidth=1.2;
        ctx.beginPath();
        ctx.moveTo(-s*0.45, -s*0.08);
        ctx.quadraticCurveTo(-s*0.9, -s*0.22, -s*1.12, w*2);
        ctx.stroke();
      }
    }

    function dorsalFin(s, color) {
      const w = wag() * 0.08;
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(-s*0.08, -s*0.22);
      ctx.quadraticCurveTo(s*0.08, -s*(0.55+w), s*0.28, -s*0.16);
      ctx.quadraticCurveTo(s*0.1, -s*0.28, -s*0.02, -s*0.2);
      ctx.fill();
    }

    function pecFin(s, color) {
      const w = wag();
      ctx.fillStyle=color;
      ctx.globalAlpha=0.85;
      ctx.beginPath();
      ctx.ellipse(s*0.08, s*0.16, s*0.16, s*0.08, 0.5 + w*0.15, 0, 6.28);
      ctx.fill();
      ctx.globalAlpha=1;
    }

    function analFin(s, color) {
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(-s*0.12, s*0.2);
      ctx.quadraticCurveTo(s*0.02, s*0.38, s*0.16, s*0.16);
      ctx.fill();
    }

    function shine(s) {
      ctx.fillStyle="rgba(255,248,242,0.5)";
      ctx.beginPath(); ctx.ellipse(s*0.16, -s*0.12, s*0.2, s*0.08, -0.35, 0, 6.28); ctx.fill();
    }

    function roundBody(s, color, tall=0.36) {
      ctx.fillStyle=color;
      ctx.beginPath(); ctx.ellipse(s*0.08, 0, s*0.5, s*tall, 0,0,6.28); ctx.fill();
      shine(s);
    }

    function drawFishBody(f) {
      const s=f.size * depthScale(f.z);
      const pose = f.pose||0;
      ctx.save();
      ctx.translate(f.x,f.y);
      ctx.rotate(Math.sin(f.phase)*0.05 + clamp(f.vy*0.08,-0.28,0.28) + clamp((f.head||1)*0.04,-0.12,0.12));
      ctx.globalAlpha = (f._cave ? 0.22 : 1) * (0.72 + depthScale(f.z)*0.28);
      const tx = turnX(pose);
      const spec = SPECIES[f.type] || SPECIES.neon;
      const body = airMix((f.genes && f.genes.body) || spec.body || "#ffd0e0", f.z);
      const fin = airMix((f.genes && f.genes.fin) || spec.fin || "#ffb0c8", f.z);

      if (pose > 0.5) {
        ctx.scale(tx, 1.04);
        tailFin(s*0.55, fin);
        ctx.fillStyle=body;
        ctx.beginPath(); ctx.ellipse(0, 0, s*0.42, s*0.38, 0,0,6.28); ctx.fill();
        shine(s*0.7);
        ctx.fillStyle=fin;
        ctx.beginPath(); ctx.ellipse(-s*0.22, s*0.12, s*0.14, s*0.08, 0.5,0,6.28); ctx.fill();
        ctx.beginPath(); ctx.ellipse(s*0.22, s*0.12, s*0.14, s*0.08, -0.5,0,6.28); ctx.fill();

      }
      if (pose < -0.5) {

        ctx.fillStyle=body;
        ctx.beginPath(); ctx.ellipse(0, 0.04*s, s*0.4, s*0.34, 0,0,6.28); ctx.fill();
        ctx.fillStyle=fin;
        ctx.beginPath(); ctx.ellipse(-s*0.18, s*0.16, s*0.12, s*0.07, 0.4,0,6.28); ctx.fill();
        ctx.beginPath(); ctx.ellipse(s*0.18, s*0.16, s*0.12, s*0.07, -0.4,0,6.28); ctx.fill();
        ctx.fillStyle="rgba(90,50,70,0.18)";
        ctx.beginPath(); ctx.ellipse(0,0,s*0.12,s*0.22,0,0,6.28); ctx.fill();

          ctx.beginPath(); ctx.arc(-s*0.02, s*0.02, s*0.08,0,6.28); ctx.fill();
          ctx.beginPath(); ctx.arc(s*0.2, -s*0.04, s*0.06,0,6.28); ctx.fill();
        } else if (pat==="saddle") {
          ctx.fillStyle = fin;
          ctx.beginPath(); ctx.moveTo(s*0.0,-s*0.12); ctx.lineTo(s*0.28,0); ctx.lineTo(s*0.0,s*0.12); ctx.fill();
        } else if (pat==="koi") {
          ctx.fillStyle = fin;
          ctx.beginPath(); ctx.ellipse(s*0.16,-s*0.04,s*0.14,s*0.1,0.4,0,6.28); ctx.fill();
          ctx.fillStyle = "#3a3a3a";
          ctx.beginPath(); ctx.ellipse(-s*0.06,s*0.08,s*0.08,s*0.06,-0.3,0,6.28); ctx.fill();
        }
      }

      if (look==="tall" || f.type==="angel") {
        ctx.fillStyle=fin;
        ctx.beginPath();
        ctx.moveTo(s*0.02,-s*0.2);
        ctx.quadraticCurveTo(s*0.08,-s*1.15, -s*0.02, -s*1.2);
        ctx.quadraticCurveTo(s*0.18,-s*0.4, s*0.16,-s*0.12);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(s*0.02,s*0.18);
        ctx.quadraticCurveTo(s*0.06,s*1.05, -s*0.04, s*1.12);
        ctx.quadraticCurveTo(s*0.2,s*0.35, s*0.16,s*0.12);
        ctx.fill();
        tailFin(s*0.85, fin, true);
        roundBody(s, body, 0.34);

        const col = body;
        const col2 = fin;
        ctx.globalAlpha=0.9;
        ctx.fillStyle=col2;
        ctx.beginPath();
        ctx.moveTo(-s*0.1,0);
        ctx.quadraticCurveTo(-s*1.05, -s*(0.85+wag()*0.08), -s*1.35, wag()*4);
        ctx.quadraticCurveTo(-s*1.0, s*(0.85+wag()*0.08), -s*0.1, 0);
        ctx.fill();
        ctx.fillStyle=col;
        ctx.beginPath();
        ctx.moveTo(s*0.05,-s*0.12);
        ctx.quadraticCurveTo(s*0.1, -s*0.95, -s*0.25, -s*0.8);
        ctx.quadraticCurveTo(s*0.22, -s*0.3, s*0.12, 0);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(s*0.0,s*0.12);
        ctx.quadraticCurveTo(s*0.05, s*0.7, -s*0.2, s*0.62);
        ctx.quadraticCurveTo(s*0.2, s*0.22, s*0.1, 0);
        ctx.fill();
        ctx.globalAlpha=1;
        roundBody(s, col, 0.28);
        pecFin(s, col2);
        cuteFace(s, f);
      } else if (look==="fancy" || look==="sword") {
        ctx.fillStyle=fin;
        ctx.beginPath();
        ctx.moveTo(-s*0.12,0);
        ctx.quadraticCurveTo(-s*0.9, -s*0.72, -s*1.22, -s*0.08 + wag()*3);
        ctx.quadraticCurveTo(-s*0.85, s*0.08, -s*1.18, s*0.55);
        ctx.quadraticCurveTo(-s*0.55, s*0.18, -s*0.12, 0);
        ctx.fill();
        if (look==="sword") {
          ctx.beginPath();
          ctx.moveTo(-s*0.2, s*0.08);
          ctx.lineTo(-s*1.35, s*0.22+wag());
          ctx.lineTo(-s*0.2, s*0.16);
          ctx.fill();

        dorsalFin(s, fin);
        pecFin(s, fin);
        roundBody(s, body, 0.28);
        paintPattern();
        cuteFace(s, f);
      } else if (look==="bottom") {
        tailFin(s*0.75, fin);
        pecFin(s, body);

        cuteFace(s, f);
      } else if (look==="puff") {
        tailFin(s*0.6, fin);
        pecFin(s, fin);
        ctx.fillStyle=body;
        ctx.beginPath(); ctx.arc(s*0.06,0,s*0.48,0,6.28); ctx.fill();
        shine(s);
        paintPattern();
        cuteFace(s*1.05, f);
      } else if (look==="neon") {
        tailFin(s, fin);
        dorsalFin(s, body);
        pecFin(s, fin);
        analFin(s, fin);
        roundBody(s, body, 0.28);
        const g=ctx.createLinearGradient(-s*0.18,0,s*0.48,0);
        g.addColorStop(0, fin); g.addColorStop(1, mixHex(fin, "#ff6b8a", 0.7));

        ctx.beginPath(); ctx.roundRect(-s*0.18,-s*0.07,s*0.68,s*0.15,8); ctx.fill();

      } else {
        tailFin(s, fin, true);
        dorsalFin(s, fin);
        pecFin(s, body);
        analFin(s, fin);
        const g=ctx.createLinearGradient(-s,0,s,0);
        g.addColorStop(0, body); g.addColorStop(1, fin);
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.ellipse(s*0.08,0,s*0.5,s*0.32,0,0,6.28); ctx.fill();

        paintPattern();
        cuteFace(s, f);

        ctx.beginPath(); ctx.moveTo(s*0.14,-s*0.16); ctx.lineTo(s*0.26,-s*0.02); ctx.moveTo(s*0.26,-s*0.16); ctx.lineTo(s*0.14,-s*0.02); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s*0.36,-s*0.16); ctx.lineTo(s*0.48,-s*0.02); ctx.moveTo(s*0.48,-s*0.16); ctx.lineTo(s*0.36,-s*0.02); ctx.stroke();

    function drawName(ent, yOff) {
      if (!opts.names || !ent.name) return;
      ctx.save();
      ctx.font = "700 9px ui-rounded, Trebuchet MS, sans-serif";
      ctx.textAlign = "center";
      const label = (ent.sex==="F"?"♀ ":ent.sex==="M"?"♂ ":"") + (ent.married ? "💍 " : "") + ent.name + (ent.kind ? " · "+ent.kind : "") + (ent.goal ? " " + ent.goal.em : "");
      const w = ctx.measureText(label).width + 8;
      ctx.fillStyle = "rgba(255,248,242,0.94)";
      ctx.beginPath(); ctx.roundRect(ent.x-w/2, ent.y-yOff-10, w, 13, 7); ctx.fill();
      ctx.fillStyle = INK;
      ctx.fillText(label, ent.x, ent.y-yOff);
      ctx.restore();
    }

    function drawBubble(ent, yOff) {
      if (!opts.chat || !ent.bubble) return;
      ctx.save();
      ctx.globalAlpha = clamp(ent.bubble.life, 0, 1);
      ctx.font = "16px Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif";
      ctx.textAlign = "center";
      const tx = ent.x, ty = ent.y - yOff - 16;
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      const w = Math.max(28, ctx.measureText(ent.bubble.text).width + 10);
      ctx.beginPath(); ctx.roundRect(tx-w/2, ty-14, w, 20, 10); ctx.fill();
      ctx.beginPath(); ctx.moveTo(tx-4, ty+6); ctx.lineTo(tx, ty+12); ctx.lineTo(tx+4, ty+6); ctx.fill();
      ctx.fillText(ent.bubble.text, tx, ty+2);
      ctx.restore();
    }

    function drawPoops() {
      for (const p of poops) {
        p.y += p.vy; p.life -= 0.0025;
        if (p.y > floorY()-6) { p.y = floorY()-6; p.vy = 0; p.life -= 0.004; }
        ctx.globalAlpha = clamp(p.life,0,1);
        ctx.fillStyle = "#7a5a3a";
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r*0.7, 0.3, 0, 6.28); ctx.fill();
      }
      ctx.globalAlpha = 1;
      poops = poops.filter(p => p.life>0);
    }

    function kawaiiEyes(x,y,spread,sz,blink) {
      const eye = (ex) => {
        if (blink>3) {
          ctx.strokeStyle="#5a3a4a"; ctx.lineWidth=1.5; ctx.lineCap="round";
          ctx.beginPath(); ctx.moveTo(ex-sz,-1); ctx.quadraticCurveTo(ex,1,ex+sz,-1); ctx.stroke();
        } else {
          ctx.fillStyle="#fff";
          ctx.beginPath(); ctx.ellipse(ex, y, sz, sz*1.15, 0,0,6.28); ctx.fill();
          ctx.fillStyle="#5a3a4a";
          ctx.beginPath(); ctx.arc(ex+sz*0.1, y, sz*0.55, 0,6.28); ctx.fill();
          ctx.fillStyle="#fff";
          ctx.beginPath(); ctx.arc(ex+sz*0.28, y-sz*0.25, sz*0.22, 0,6.28); ctx.fill();
        }
      };
      eye(x-spread); eye(x+spread);
    }
    function kawaiiSmile(x,y,r,ent,c) {
      drawMouth(x,y,r, faceMood(ent));
    }
    function kawaiiBlush(x,y) {
      if (!opts.blush) return;
      ctx.fillStyle=BLUSH;
      ctx.beginPath(); ctx.ellipse(x-5.5,y,2.4,1.2,0,0,6.28); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+5.5,y,2.4,1.2,0,0,6.28); ctx.fill();
    }
    function drawCritterKind(c, step) {
      const k = c.kind, cc = airMix(c.color || "#ffb0c8", c.z);
      const hi = mixHex(cc,"#ffffff",0.35);
      ctx.lineCap="round"; ctx.lineJoin="round";
      if (k==="crab") {
        ctx.strokeStyle=cc; ctx.lineWidth=1.7;
        for (let i=0;i<3;i++) {
          const ox=-5+i*5, lift=((i%2)?1:-1)*step*2;
          ctx.beginPath(); ctx.moveTo(ox,3); ctx.quadraticCurveTo(ox-5,8+lift,ox-7,11+lift); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(ox,3); ctx.quadraticCurveTo(ox+5,8-lift,ox+7,11-lift); ctx.stroke();
        }
        ctx.fillStyle=cc; ctx.beginPath(); ctx.ellipse(0,0,11,7,0,0,6.28); ctx.fill();
        ctx.fillStyle=hi; ctx.beginPath(); ctx.ellipse(0,-1.2,6.5,3.6,0,0,6.28); ctx.fill();
        [[-11,-2,-0.5],[11,-2,0.5]].forEach(([x,y,r])=>{
          ctx.save(); ctx.translate(x,y+step); ctx.rotate(r);
          ctx.fillStyle=cc; ctx.beginPath(); ctx.ellipse(0,0,4,3,0,0,6.28); ctx.fill();
          ctx.beginPath(); ctx.ellipse(3, -2, 2.2,1.3,-0.4,0,6.28); ctx.fill();
          ctx.beginPath(); ctx.ellipse(3, 2, 2.2,1.3,0.4,0,6.28); ctx.fill();
          ctx.restore();
        });
        kawaiiEyes(0,-1.4,3.4,2.4,c.blink||0); kawaiiSmile(0,1.8,1.8,c); kawaiiBlush(0,1.6);
      } else if (k==="fiddler") {
        ctx.strokeStyle=cc; ctx.lineWidth=1.5;
        for (let i=0;i<2;i++) { ctx.beginPath(); ctx.moveTo(-3+i*6,3); ctx.lineTo(-6+i*6,10+step); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-3+i*6,3); ctx.lineTo(i*6,10-step); ctx.stroke(); }
        ctx.fillStyle=cc; ctx.beginPath(); ctx.ellipse(1,0,8,6,0,0,6.28); ctx.fill();
        ctx.save(); ctx.translate(-12,-3+step*0.4); ctx.rotate(-0.5);
        ctx.fillStyle=cc; ctx.beginPath(); ctx.ellipse(0,0,7.5,5.2,0,0,6.28); ctx.fill();
        ctx.fillStyle=hi; ctx.beginPath(); ctx.ellipse(-1,-1,3,2,0,0,6.28); ctx.fill();
        ctx.restore();
        ctx.fillStyle=cc; ctx.beginPath(); ctx.ellipse(10,-1,3,2.2,0,0,6.28); ctx.fill();
        kawaiiEyes(2,-1.5,2.6,2.2,c.blink||0); kawaiiSmile(2,1.4,1.5,c); kawaiiBlush(2,1.4);
